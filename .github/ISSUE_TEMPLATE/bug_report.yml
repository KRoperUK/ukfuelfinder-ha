name: Bug report
description: Report a problem with the UK Fuel Finder integration.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.
  - type: input
    id: version
    attributes:
      label: Integration version
      description: Which version of the UK Fuel Finder integration are you running?
      placeholder: e.g. 1.5.2
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      description: Which version of Home Assistant are you running?
      placeholder: e.g. 2025.7.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can someone else reproduce the problem?
      placeholder: |
        1. Go to Settings → Devices & Services
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen instead?
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Debug logs
      description: |
        Relevant logs with debug logging enabled for `custom_components.ukfuelfinder` and `ukfuelfinder`.
        **Redact your Client ID, Client Secret, and any tokens before posting.**
      render: text
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, station details, or anything else that might help.
    validations:
      required: false
